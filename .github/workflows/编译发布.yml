name: 编译并发布 AP8220 AP 专用固件
run-name: AP8220 AP 专用固件 · ${{ inputs.lean_ref }}

on:
  workflow_dispatch:
    inputs:
      lean_ref:
        description: Lean 源码分支、标签或完整提交，默认获取 master 最新版本
        required: true
        type: string
        default: master
      publish:
        description: 全部检查通过后自动发布 Release
        required: true
        type: boolean
        default: true
      wifi_ssid:
        description: 2.4GHz SSID；两台 AP 保持一致
        required: true
        type: string
        default: Home-WiFi
      wifi_ssid_5g:
        description: 5GHz SSID；留空与 2.4GHz 相同，也可填写独立名称
        required: false
        type: string
        default: ""
      wifi_key:
        description: Wi-Fi 密码；留空优先用 Secret WIFI_KEY，否则 12345678
        required: false
        type: string
        default: ""
      root_password:
        description: 管理密码；留空优先用 Secret ROOT_PASSWORD，否则 password
        required: false
        type: string
        default: ""
      channel_2g:
        description: 2.4GHz 信道或 auto；第一台 1，第二台可设 11
        required: true
        type: string
        default: "1"
      channel_5g:
        description: 5GHz 信道或 auto；第一台 36，第二台可按法规设 149
        required: true
        type: string
        default: "36"
      mobility_domain:
        description: 两台 AP 使用相同的四位十六进制漫游域
        required: true
        type: string
        default: a1b2
      country:
        description: 实际使用地区的两位国家码
        required: true
        type: string
        default: CN

permissions:
  contents: read

concurrency:
  group: ap8220-ap-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 编译、检查镜像并交付
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      LEAN_REF: ${{ inputs.lean_ref }}
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 1500M
      CCACHE_COMPRESS: "1"
      TZ: Asia/Shanghai
    steps:
      - name: 检出版本化项目源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1，Node.js 24
        with:
          persist-credentials: false
      - name: 校验本次编译参数
        env:
          WIFI_SSID: ${{ inputs.wifi_ssid }}
          WIFI_SSID_5G: ${{ inputs.wifi_ssid_5g }}
          WIFI_KEY: ${{ inputs.wifi_key }}
          WIFI_KEY_SECRET: ${{ secrets.WIFI_KEY }}
          ROOT_PASSWORD: ${{ inputs.root_password }}
          ROOT_PASSWORD_SECRET: ${{ secrets.ROOT_PASSWORD }}
          CHANNEL_2G: ${{ inputs.channel_2g }}
          CHANNEL_5G: ${{ inputs.channel_5g }}
          MOBILITY_DOMAIN: ${{ inputs.mobility_domain }}
          COUNTRY: ${{ inputs.country }}
        run: python3 scripts/configure_profile.py --output work/ap-profile.json
      - name: 检查两种布局的启动配套文件
        run: python3 scripts/boot_assets.py
      - name: 发布前检查原厂 U-Boot 已补齐
        if: ${{ inputs.publish }}
        run: python3 scripts/boot_assets.py --require-complete
      - name: 释放编译磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h .
      - name: 安装固定环境所需依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib g++-multilib bison flex gawk \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev libyaml-dev \
            gettext file rsync unzip zip xz-utils zstd bzip2 cpio bc \
            git wget curl ca-certificates patch perl python3 python3-yaml \
            python3-setuptools python3-pyelftools python3-dev python3-ply \
            cmake ninja-build pkg-config libjson-c-dev ccache \
            autoconf automake autopoint libtool intltool help2man gperf \
            swig subversion device-tree-compiler squashfs-tools shellcheck \
            xsltproc xmlto asciidoc docbook-utils fastjar msmtp re2c \
            scons qemu-utils
      - name: 构建检查用原生 UCI
        run: python3 scripts/native_uci.py --output work/native-uci
      - name: 检查版本、配置、脚本和首次启动逻辑
        env:
          AP8220_NATIVE_UCI: ${{ github.workspace }}/work/native-uci/bin/uci
          LD_LIBRARY_PATH: ${{ github.workspace }}/work/native-uci/lib
        run: |
          python3 scripts/check_source.py
          python3 -m unittest discover -s tests -v
      - name: 解析并锁定最新源码与软件源
        id: resolve
        run: python3 scripts/resolve_sources.py --lean-ref "$LEAN_REF" --output work/sources.lock.json
      - name: 恢复编译缓存
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0，Node.js 24
        with:
          path: .cache/ccache
          key: ap8220-ap-ccache-${{ runner.os }}-${{ steps.resolve.outputs.cache_key }}-${{ hashFiles('config/**', 'package/**') }}
          restore-keys: |
            ap8220-ap-ccache-${{ runner.os }}-
      - name: 分别编译并核验两种分区固件
        run: python3 scripts/build_variants.py --lock work/sources.lock.json --profile work/ap-profile.json
      - name: 整理各自的完整发布包
        if: ${{ inputs.publish }}
        id: collect
        run: python3 scripts/assemble_release.py --lock work/sources.lock.json --output release
      - name: 发布带版本号的源码与固件
        if: ${{ success() && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.collect.outputs.tag }}
          RELEASE_TITLE: ${{ steps.collect.outputs.title }}
        run: |
          gh release create "$RELEASE_TAG" release/* \
            --title "$RELEASE_TITLE" \
            --notes-file release/发布说明.md \
            --target "$GITHUB_SHA" \
            --latest
      - name: 写入简体中文构建摘要
        if: always()
        env:
          RESULT: ${{ job.status }}
          RELEASE_TAG: ${{ steps.collect.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = ["## AP8220 AP专用固件", "", "源码版本：v" + Path("VERSION").read_text().strip()]
          text += ["", "任务结果：" + {"success": "成功", "failure": "失败", "cancelled": "已取消"}.get(os.environ["RESULT"], os.environ["RESULT"])]
          if os.environ.get("RELEASE_TAG"):
              text += ["", "交付版本：" + os.environ["RELEASE_TAG"]]
          text += ["", "编译日志保留在 Actions 页面；未上传固件到 Artifacts。"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(text) + "\n")
          PY
